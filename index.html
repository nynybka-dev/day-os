<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ОС дня</title>
<style>
  body{font-family:sans-serif;background:#0f1115;color:#e6e6e6;padding:12px}
  #nowBox{background:#1b1f27;padding:14px;border-radius:14px;margin-bottom:12px}
  #action{font-size:20px;font-weight:bold;margin-top:6px}
  #avoid{opacity:.8;margin-top:4px}
  .grid{display:grid;grid-template-columns:180px repeat(7,1fr);gap:4px;margin-top:12px}
  .cell{padding:6px;text-align:center;border-radius:8px;background:#1b1f27;display:flex;align-items:center;justify-content:center}
  .header{background:#2a3040;font-weight:bold}
  .done{background:#2b6a62}
  input[type="checkbox"]{transform:scale(1.2)}
  button{margin-top:8px;margin-right:6px;padding:6px 12px;border:none;border-radius:8px;background:#2a3040;color:white}
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
  #modalBox{background:#1b1f27;padding:16px;border-radius:14px;max-width:380px;white-space:pre-line}
  .small{opacity:.8;font-size:13px;margin-top:6px}
</style>
</head>
<body>

<h2>Сейчас</h2>
<div id="nowBox">
  <div id="time"></div>
  <div id="block"></div>
  <div id="energy"></div>
  <div id="action"></div>
  <div id="avoid"></div>
</div>

<div>
  <button onclick="setEnergy('energy')">Бодрый</button>
  <button onclick="setEnergy('ok')">Нормально</button>
  <button onclick="setEnergy('tired')">Устал</button>
  <button onclick="setEnergy('over')">Перегружен</button>
</div>

<div class="small">Галочки — обзор недели</div>
<div id="board" class="grid"></div>

<div id="modal">
  <div id="modalBox">
    <div id="modalText"></div>
    <button onclick="closeModal()">Закрыть</button>
  </div>
</div>

<script>
(function(){
  // ES5-совместимый код (без const/let), чтобы не ломаться в iOS-просмотрах, которые используют document.write.

  var days=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
  var energy = (localStorage.getItem('energy') || 'ok');

  // Работа 09:00–18:00
  var schedule=[
    {key:'morning',title:'Утро',start:6.5,end:8.5,action:'запуск дня: вода + свет + 5 минут разминки',avoid:'не трогай телефон первые 10 минут'},
    {key:'commute_in',title:'Дорога',start:8.5,end:9.0,action:'переход в работу: тишина/музыка',avoid:'не открывай новости'},
    {key:'work1',title:'Фокус',start:9.0,end:11.0,action:'1 главная задача: 50 мин работа / 5 мин пауза',avoid:'не прыгай между задачами'},
    {key:'break',title:'Перерыв',start:11.0,end:11.2,action:'встань, 200–400 шагов, взгляд вдаль',avoid:'не открывай соцсети'},
    {key:'work2',title:'Работа',start:11.2,end:13.0,action:'закрывай текущие задачи списком',avoid:'не начинай новое без причины'},
    {key:'lunch',title:'Обед',start:13.0,end:14.0,action:'ешь спокойно 15–20 минут, потом 5 минут ходьбы',avoid:'без телефона'},
    {key:'work3',title:'Работа',start:14.0,end:16.5,action:'доводи до результата, фиксируй прогресс',avoid:'не уходи в перфекционизм'},
    {key:'break2',title:'Микроперерыв',start:16.5,end:16.7,action:'2–5 минут движения/вода',avoid:'не зависай в ленте'},
    {key:'work4',title:'Лёгкие задачи',start:16.7,end:18.0,action:'рутина, ответы, подготовка на завтра',avoid:'не бери сложное в конце дня'},
    {key:'commute_out',title:'Дорога домой',start:18.0,end:18.3,action:'выход из работы: длинный выдох',avoid:'не прокручивай рабочие диалоги'},
    {key:'reset',title:'Сброс',start:18.3,end:19.2,action:'умыться/переодеться/10 минут тишины',avoid:'не ныряй сразу в задачи'},
    {key:'learn',title:'Учёба',start:19.5,end:20.5,action:'1 тема, 3–5 тезисов, 1 применение',avoid:'не требуй идеала'},
    {key:'sleepPrep',title:'Подготовка ко сну',start:21.0,end:22.0,action:'выключай стимулы, приглуши свет',avoid:'без новостей'},
    {key:'sleep',title:'Сон',start:22.0,end:24.0,action:'сон',avoid:'не бери телефон в кровать'}
  ];

  function nowHour(){
    var d=new Date();
    return d.getHours()+d.getMinutes()/60;
  }

  function findCurrentBlock(){
    var t=nowHour();
    for(var i=0;i<schedule.length;i++){
      if(t>=schedule[i].start && t<schedule[i].end) return schedule[i];
    }
    return null;
  }

  function findNextBlock(){
    var t=nowHour();
    for(var i=0;i<schedule.length;i++){
      if(t<schedule[i].start) return schedule[i];
    }
    return schedule[0]; // если после полуночи — покажем утро
  }

  function renderNow(){
    var t=new Date();
    document.getElementById('time').innerText=t.toLocaleTimeString();

    var b=findCurrentBlock();
    if(!b){
      // если сейчас вне блоков (например ночью) — показываем следующий блок, чтобы экран не был пустым
      b=findNextBlock();
      document.getElementById('block').innerText='Сейчас вне блоков. Следующий: '+b.title;
    } else {
      document.getElementById('block').innerText='Блок: '+b.title;
    }

    document.getElementById('energy').innerText='Состояние: '+energy;

    var action=b.action;
    var avoid=b.avoid;

    // Энергетические правила (замкнутый цикл)
    if(energy==='over'){
      action='Сброс: 3 минуты дыхание + 3 минуты ходьбы + вода.';
      avoid='Не принимать решений и не усложнять. Никакой учёбы и сложных задач.';
    } else if(energy==='tired'){
      // при усталости смягчаем фокус/учёбу
      if(b.key.indexOf('work')===0){
        action='Упрощение: 25 минут работа / 5 минут пауза. Только следующий шаг.';
        avoid='Не пытайся закрыть всё сразу. Без многозадачности.';
      }
      if(b.key==='learn'){
        action='Мини-учёба: 10–15 минут чтения + 1 тезис.';
        avoid='Не мучай себя часом. Главное — не обнулиться.';
      }
    } else if(energy==='energy'){
      if(b.key==='reset' || b.key==='learn'){
        action='Если силы есть: 45–60 минут учёбы с конспектом.';
        avoid='Не разгоняйся кофеином/лентой.';
      }
    }

    document.getElementById('action').innerText='Действие: '+action;
    document.getElementById('avoid').innerText='Не делать: '+avoid;
  }

  window.setEnergy=function(e){
    energy=e;
    localStorage.setItem('energy',e);
    renderNow();
  };

  window.closeModal=function(){
    document.getElementById('modal').style.display='none';
  };

  // --- WEEK CHECKS ---
  function weekKey(){
    var d=new Date();
    var day=d.getDay(); // 0..6
    var diff=(day===0 ? -6 : 1-day);
    var monday=new Date(d.getFullYear(), d.getMonth(), d.getDate());
    monday.setDate(monday.getDate()+diff);
    return monday.toISOString().slice(0,10);
  }

  function loadChecks(){
    try{ return JSON.parse(localStorage.getItem('checks_'+weekKey())||'{}'); }
    catch(e){ return {}; }
  }

  function saveChecks(c){
    localStorage.setItem('checks_'+weekKey(), JSON.stringify(c));
  }

  function renderBoard(){
    var board=document.getElementById('board');
    var checks=loadChecks();

    board.innerHTML='<div class="cell header"></div>'+days.map(function(d){return '<div class="cell header">'+d+'</div>';}).join('');

    for(var r=0;r<schedule.length;r++){
      var b=schedule[r];
      board.innerHTML += '<div class="cell">'+b.title+'</div>';
      for(var i=0;i<7;i++){
        var key=b.key+'_'+i;
        var checked=!!checks[key];
        board.innerHTML += '<div class="cell '+(checked?'done':'')+'"><input type="checkbox" '+(checked?'checked':'')+' id="'+key+'"></div>';
      }
    }

    for(var r2=0;r2<schedule.length;r2++){
      var b2=schedule[r2];
      for(var i2=0;i2<7;i2++){
        (function(blockKey, dayIndex){
          var key2=blockKey+'_'+dayIndex;
          var el=document.getElementById(key2);
          if(!el) return;
          el.addEventListener('change',function(){
            checks[key2]=el.checked;
            saveChecks(checks);
            // подсветка клетки
            var cell=el.parentNode;
            if(cell){
              if(el.checked) cell.className='cell done';
              else cell.className='cell';
            }
          });
        })(b2.key, i2);
      }
    }
  }

  // Инициализация (без ожидания DOMContentLoaded, т.к. скрипт стоит внизу body)
  renderBoard();
  renderNow();
  setInterval(renderNow, 60000);
})();
</script>

</body>
</html>
